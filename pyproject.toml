[project]
name = "forum"
version = "2026-08-30"
description = "Forum pour la famille et amis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django==4.2",
    "gunicorn>=26.2.0",
    "psycopg>=3.1",
]

[project.scripts]
forum = "forum:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
